name: Sales briefing ingest

# Runs daily; also manual from Actions tab.
on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC ≈ 07:00 Brazil
  workflow_dispatch:

jobs:
  ingest:
    name: Ingest sales briefs
    runs-on: ubuntu-latest
    steps:
      - name: Call sales-briefing-ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SUPABASE_URL or CRON_SECRET secrets"
            exit 1
          fi
          curl -fsS -X POST \
            "${SUPABASE_URL}/functions/v1/sales-briefing-ingest" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}'
